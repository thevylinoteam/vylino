name: Vylino Lockfile Bootstrap

on:
  push:
    branches:
      - feature/phase-2-integrations

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feature/phase-2-integrations

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'

      - name: Generate Vylino lockfile
        working-directory: packages/twenty-apps/internal/vylino
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
        run: yarn install

      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- packages/twenty-apps/internal/vylino/yarn.lock; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/twenty-apps/internal/vylino/yarn.lock
          git commit -m "build(vylino): generate app yarn lock"
          git push origin HEAD:feature/phase-2-integrations

      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: vylino-yarn-lock
          path: packages/twenty-apps/internal/vylino/yarn.lock
          if-no-files-found: error
