name: CRM PHP Lint

on:
  push:
    branches:
      - crm-development
    paths:
      - 'crm/**/*.php'
      - '.github/workflows/crm-php-lint.yml'
  pull_request:
    paths:
      - 'crm/**/*.php'
      - '.github/workflows/crm-php-lint.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: PHP syntax check
        run: |
          find crm -type f -name '*.php' -print0 | xargs -0 -n1 php -l
